<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Fit — Дашборд</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col">
  <div id="preloader" aria-hidden="true">
    <div class="pl-wrap">
      <svg class="pl-ring" viewBox="0 0 120 120"><circle class="pl-track" cx="60" cy="60" r="52"/><circle class="pl-fill" cx="60" cy="60" r="52"/></svg>
      <div class="pl-num"><span id="plNum">0</span><small data-i18n="kcal_unit">ккал</small></div>
    </div>
    <div class="pl-brand">Change <b>Fit</b></div>
  </div>
  <script>if (sessionStorage.getItem('nt_pl')) { var p = document.getElementById('preloader'); if (p) p.remove(); }</script>


  <header class="border-b border-[var(--border-color)] bg-[var(--bg-card)] sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      <a href="index.html" class="flex items-center gap-2 font-extrabold text-xl tracking-tight">
        <span class="w-9 h-9 rounded-xl bg-emerald-500 text-white flex items-center justify-center">🥗</span>
        <span>Change <span class="text-emerald-500">Fit</span></span>
      </a>

      <nav class="flex items-center gap-1 text-sm">
        <a href="index.html" class="nav-link" data-i18n="nav_plan">Мой План</a>
        <a href="dashboard.html" class="nav-link active" data-i18n="nav_dash">Дашборд</a>
        <a href="scanner.html" class="nav-link" data-i18n="nav_scan">AI Сканер Еды</a>
        <a href="search.html" class="nav-link" data-i18n="nav_search">База Продуктов</a>
      </nav>

      <div class="flex items-center gap-2">
        <div id="langMenu" class="lang-menu"></div>
        <a id="accountChip" href="register.html" class="account-chip"></a>
        <button onclick="toggleTheme(event)" class="p-2 rounded-xl border border-[var(--border-color)]" aria-label="Theme"><span class="theme-ico"><span data-icon="sun"></span><span data-icon="moon"></span></span></button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 flex-1 w-full space-y-8">
    <div class="flex flex-wrap items-center justify-between gap-4">
      <h1 class="text-2xl md:text-3xl font-extrabold" data-i18n="dash_title">Дневной баланс калорий и БЖУ</h1>
      <div class="flex gap-3">
        <a href="scanner.html" class="btn-primary text-sm">📸 AI Фото-Сканер</a>
        <button onclick="resetDay()" class="px-4 py-2 rounded-xl border border-[var(--border-color)] text-sm hover:border-red-500 hover:text-red-500" data-i18n="btn_reset_day">Сбросить день</button>
      </div>
    </div>

    <!-- Главная карточка калорий и остатка БЖУ -->
    <div class="grid md:grid-cols-12 gap-6">
      <div class="card p-6 md:col-span-5 flex flex-col justify-between">
        <div>
          <span class="ico-badge" data-icon="flame" style="--c:#10b981"></span><span class="text-xs uppercase font-bold tracking-wider text-[var(--text-muted)]" data-i18n="kcal_left">Осталось ккал</span>
          <div class="text-5xl font-extrabold text-emerald-500 my-2" id="kcalRemaining">2050</div>
        </div>
        <div class="space-y-2">
          <div class="progress-bar-bg">
            <div id="kcalBar" class="progress-bar-fill bg-emerald-500" style="width: 0%"></div>
          </div>
          <div class="flex justify-between text-xs text-[var(--text-muted)] font-semibold">
            <span><span data-i18n="kcal_eaten">Съедено</span>: <strong id="kcalEaten" class="text-[var(--text-main)]">0</strong></span>
            <span><span data-i18n="kcal_goal">Норма</span>: <strong id="kcalGoal" class="text-[var(--text-main)]">2050</strong></span>
          </div>
        </div>
      </div>

      <!-- Остаток Углеводов, Белков и Жиров -->
      <div class="card p-6 md:col-span-7 grid sm:grid-cols-3 gap-4">
        <!-- Углеводы -->
        <div class="p-4 rounded-2xl bg-[var(--bg-main)] flex flex-col justify-between">
          <div>
            <span class="ico-badge" data-icon="zap" style="--c:#10b981"></span><span class="text-xs text-[var(--text-muted)] font-semibold" data-i18n="rem_carbs">Осталось углеводов</span>
            <div class="text-2xl font-extrabold text-emerald-500 mt-1"><span id="carbsLeft">230</span> <span class="text-sm">г</span></div>
          </div>
          <div class="mt-4">
            <div class="progress-bar-bg mb-1.5">
              <div id="carbsBar" class="progress-bar-fill bg-emerald-500" style="width: 0%"></div>
            </div>
            <div class="text-xs text-[var(--text-muted)]"><span id="carbsEaten">0</span> / <span id="carbsGoal">230</span> г</div>
          </div>
        </div>

        <!-- Белки -->
        <div class="p-4 rounded-2xl bg-[var(--bg-main)] flex flex-col justify-between">
          <div>
            <span class="ico-badge" data-icon="dumbbell" style="--c:#3b82f6"></span><span class="text-xs text-[var(--text-muted)] font-semibold" data-i18n="rem_protein">Осталось белков</span>
            <div class="text-2xl font-extrabold text-blue-500 mt-1"><span id="proteinLeft">154</span> <span class="text-sm">г</span></div>
          </div>
          <div class="mt-4">
            <div class="progress-bar-bg mb-1.5">
              <div id="proteinBar" class="progress-bar-fill bg-blue-500" style="width: 0%"></div>
            </div>
            <div class="text-xs text-[var(--text-muted)]"><span id="proteinEaten">0</span> / <span id="proteinGoal">154</span> г</div>
          </div>
        </div>

        <!-- Жиры -->
        <div class="p-4 rounded-2xl bg-[var(--bg-main)] flex flex-col justify-between">
          <div>
            <span class="ico-badge" data-icon="drop" style="--c:#f59e0b"></span><span class="text-xs text-[var(--text-muted)] font-semibold" data-i18n="rem_fats">Осталось жиров</span>
            <div class="text-2xl font-extrabold text-amber-500 mt-1"><span id="fatsLeft">57</span> <span class="text-sm">г</span></div>
          </div>
          <div class="mt-4">
            <div class="progress-bar-bg mb-1.5">
              <div id="fatsBar" class="progress-bar-fill bg-amber-500" style="width: 0%"></div>
            </div>
            <div class="text-xs text-[var(--text-muted)]"><span id="fatsEaten">0</span> / <span id="fatsGoal">57</span> г</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Список съеденных продуктов -->
    <div class="card p-6">
      <h2 class="text-lg font-bold mb-4" data-i18n="history_title">Съедено сегодня</h2>
      <div id="mealsContainer" class="space-y-3"></div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    let firstRender = true;
    const esc = v => String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const $ = id => document.getElementById(id);

    function setBar(id, pct, over) {
      const bar = $(id);
      bar.classList.toggle('over-bar', over);
      setTimeout(() => { bar.style.width = Math.min(100, pct) + '%'; }, 60);
    }

    function setMacro(key, goal, eaten) {
      animateNumber($(key + 'Left'), Math.max(0, Math.round(goal - eaten)));
      animateNumber($(key + 'Eaten'), Math.round(eaten));
      $(key + 'Goal').textContent = goal;
      setBar(key + 'Bar', goal ? (eaten / goal) * 100 : 0, eaten > goal);
    }

    function renderPageSpecific() {
      const { plan, consumed, lang } = getState();

      // суммируем точные значения, округляем только при показе
      const totals = consumed.reduce((a, i) => ({ kcal: a.kcal + i.kcal, p: a.p + i.p, f: a.f + i.f, c: a.c + i.c }), { kcal: 0, p: 0, f: 0, c: 0 });

      const rem = Math.round(plan.dailyKcal - totals.kcal);
      const label = document.querySelector('[data-i18n="kcal_left"]');
      label.textContent = rem < 0 ? t('over_label') : t('kcal_left');
      $('kcalRemaining').classList.toggle('over', rem < 0);
      animateNumber($('kcalRemaining'), Math.abs(rem));
      animateNumber($('kcalEaten'), Math.round(totals.kcal));
      $('kcalGoal').textContent = plan.dailyKcal;
      setBar('kcalBar', (totals.kcal / plan.dailyKcal) * 100, rem < 0);

      setMacro('carbs', plan.carbs, totals.c);
      setMacro('protein', plan.protein, totals.p);
      setMacro('fats', plan.fats, totals.f);

      const container = $('mealsContainer');
      if (consumed.length === 0) {
        container.innerHTML = `<p class="text-sm text-[var(--text-muted)] py-6 text-center">${t('empty_history')}</p>`;
        return;
      }

      container.innerHTML = consumed.map((item, i) => {
        const food = foodDatabase.find(f => f.id === item.foodId) || foodDatabase[0];
        const anim = firstRender ? `meal-in" style="animation-delay:${i * 60}ms` : '';
        return `
          <div id="meal-${item.uid}" class="flex flex-wrap items-center justify-between gap-4 p-4 rounded-xl bg-[var(--bg-main)] ${anim}">
            <div class="flex items-center gap-3">
              <span class="text-2xl">${item.customIcon || food.icon}</span>
              <div>
                <div class="font-bold">${item.customName ? esc(item.customName) : food.name[lang]}</div>
                <div class="text-xs text-[var(--text-muted)]">${item.grams ? item.grams + ' ' + t('gram_unit') + ' • ' : ''}${item.time}</div>
              </div>
            </div>
            <div class="flex items-center gap-4 text-sm">
              <span class="px-2.5 py-1 rounded-lg bg-emerald-500/15 text-emerald-500 font-bold">-${Math.round(item.kcal)} ${t('kcal_unit')}</span>
              <span class="text-xs text-[var(--text-muted)]">${t('protein')[0]}: ${item.p.toFixed(1)} | ${t('fats')[0]}: ${item.f.toFixed(1)} | ${t('carbs')[0]}: ${item.c.toFixed(1)}</span>
              <button onclick="deleteMeal(${item.uid})" class="text-red-400 hover:text-red-500 font-bold">✕</button>
            </div>
          </div>
        `;
      }).join('');
      firstRender = false;
    }

    function deleteMeal(uid) {
      const row = $('meal-' + uid);
      if (row) row.classList.add('meal-out');
      setTimeout(() => {
        const state = getState();
        state.consumed = state.consumed.filter(m => m.uid !== uid);
        saveState(state);
        firstRender = false;
        renderPageSpecific();
      }, 280);
    }

    function resetDay() {
      const state = getState();
      state.consumed = [];
      saveState(state);
      firstRender = false;
      renderPageSpecific();
    }
  </script>
</body>
</html>
