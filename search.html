<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Fit — Поиск калорий по граммам</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col">
  <div id="preloader" aria-hidden="true">
    <div class="pl-wrap">
      <svg class="pl-ring" viewBox="0 0 120 120"><circle class="pl-track" cx="60" cy="60" r="52"/><circle class="pl-fill" cx="60" cy="60" r="52"/></svg>
      <div class="pl-num"><span id="plNum">0</span><small data-i18n="kcal_unit">ккал</small></div>
    </div>
    <div class="pl-brand">Change <b>Fit</b></div>
  </div>
  <script>if (sessionStorage.getItem('nt_pl')) { var p = document.getElementById('preloader'); if (p) p.remove(); }</script>


  <header class="border-b border-[var(--border-color)] bg-[var(--bg-card)] sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      <a href="index.html" class="flex items-center gap-2 font-extrabold text-xl tracking-tight">
        <span class="w-9 h-9 rounded-xl bg-emerald-500 text-white flex items-center justify-center">🥗</span>
        <span>Change <span class="text-emerald-500">Fit</span></span>
      </a>

      <nav class="flex items-center gap-1 text-sm">
        <a href="index.html" class="nav-link" data-i18n="nav_plan">Мой План</a>
        <a href="dashboard.html" class="nav-link" data-i18n="nav_dash">Дашборд</a>
        <a href="scanner.html" class="nav-link" data-i18n="nav_scan">AI Сканер Еды</a>
        <a href="search.html" class="nav-link active" data-i18n="nav_search">База Продуктов</a>
      </nav>

      <div class="flex items-center gap-2">
        <div id="langMenu" class="lang-menu"></div>
        <a id="accountChip" href="register.html" class="account-chip"></a>
        <button onclick="toggleTheme(event)" class="p-2 rounded-xl border border-[var(--border-color)]" aria-label="Theme"><span class="theme-ico"><span data-icon="sun"></span><span data-icon="moon"></span></span></button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 flex-1 w-full space-y-6">
    <div>
      <h1 class="text-2xl md:text-3xl font-extrabold mb-3" data-i18n="search_title">Калькулятор калорийности по граммам</h1>
      <input type="text" id="searchInput" oninput="renderPageSpecific()" data-i18n-placeholder="search_placeholder" placeholder="Поиск продукта..." class="input-field text-base">
    </div>

    <div id="catChips" class="flex flex-wrap gap-2"></div>

    <div id="foodGrid" class="grid sm:grid-cols-2 gap-4"></div>
  </main>

  <script src="app.js"></script>
  <script>
    let activeCat = 'all';
    function setCat(c) { activeCat = c; renderPageSpecific(); }

    function renderPageSpecific() {
      const { lang } = getState();
      const query = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
      const grid = document.getElementById('foodGrid');

      document.getElementById('catChips').innerHTML = Object.keys(CATS).map(c =>
        `<button type="button" class="chip${c === activeCat ? ' active' : ''}" onclick="setCat('${c}')">${CATS[c][lang]}</button>`
      ).join('');

      // ищем по названию на любом из 4 языков
      const filtered = foodDatabase.filter(item =>
        (activeCat === 'all' || item.cat === activeCat) &&
        (!query || Object.values(item.name).some(n => n.toLowerCase().includes(query)))
      );

      grid.innerHTML = !filtered.length ? `<p class="text-sm text-[var(--text-muted)] col-span-full text-center py-10">${t('no_results')}</p>` : filtered.map(food => `
        <div class="card p-5 flex flex-col justify-between gap-4">
          <div class="flex items-start justify-between gap-3">
            <div class="flex items-center gap-3">
              <span class="text-3xl">${food.icon}</span>
              <div>
                <h3 class="font-bold text-base">${food.name[lang]}</h3>
                <span class="text-xs text-[var(--text-muted)]">${food.kcal} ${t('kcal_unit')} / ${t('per_100g')}</span>
              </div>
            </div>
            <span id="calcKcal-${food.id}" class="px-3 py-1 rounded-xl bg-emerald-500/15 text-emerald-500 font-extrabold text-sm">
              ${food.kcal} ${t('kcal_unit')}
            </span>
          </div>

          <div class="grid grid-cols-3 gap-2 text-center text-xs bg-[var(--bg-main)] p-2.5 rounded-xl">
            <div><span class="text-[var(--text-muted)]">${t('protein')}:</span> <strong id="calcP-${food.id}" class="text-blue-500">${food.p}г</strong></div>
            <div><span class="text-[var(--text-muted)]">${t('fats')}:</span> <strong id="calcF-${food.id}" class="text-amber-500">${food.f}г</strong></div>
            <div><span class="text-[var(--text-muted)]">${t('carbs')}:</span> <strong id="calcC-${food.id}" class="text-emerald-500">${food.c}г</strong></div>
          </div>

          <div class="flex items-center gap-3">
            <label class="text-xs font-semibold text-[var(--text-muted)]" data-i18n="lbl_grams">${t('lbl_grams')}</label>
            <input type="number" id="gramInput-${food.id}" value="100" min="1" max="3000"
              oninput="updateCardMacros(${food.id})"
              class="input-field !py-1.5 !px-3 text-sm font-bold w-24">
            <button onclick="quickAddFromSearch(${food.id})" class="btn-primary !py-2 !px-4 text-xs ml-auto">
              ${t('btn_add_meal')}
            </button>
          </div>
        </div>
      `).join('');
    }

    function updateCardMacros(id) {
      const food = foodDatabase.find(f => f.id === id);
      const grams = parseFloat(document.getElementById(`gramInput-${id}`).value) || 0;
      const ratio = grams / 100;

      document.getElementById(`calcKcal-${id}`).textContent = `${Math.round(food.kcal * ratio)} ${t('kcal_unit')}`;
      document.getElementById(`calcP-${id}`).textContent = `${(food.p * ratio).toFixed(1)}г`;
      document.getElementById(`calcF-${id}`).textContent = `${(food.f * ratio).toFixed(1)}г`;
      document.getElementById(`calcC-${id}`).textContent = `${(food.c * ratio).toFixed(1)}г`;
    }

    function quickAddFromSearch(id) {
      const grams = parseFloat(document.getElementById(`gramInput-${id}`).value) || 0;
      if (grams <= 0) return;
      addMealRecord(id, grams);
      showDone(() => { window.location.href = 'dashboard.html'; });
    }
  </script>
</body>
</html>
