<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Fit — Регистрация</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col">
  <div id="preloader" aria-hidden="true">
    <div class="pl-wrap">
      <svg class="pl-ring" viewBox="0 0 120 120"><circle class="pl-track" cx="60" cy="60" r="52"/><circle class="pl-fill" cx="60" cy="60" r="52"/></svg>
      <div class="pl-num"><span id="plNum">0</span><small data-i18n="kcal_unit">ккал</small></div>
    </div>
    <div class="pl-brand">Change <b>Fit</b></div>
  </div>
  <script>if (sessionStorage.getItem('nt_pl')) { var p = document.getElementById('preloader'); if (p) p.remove(); }</script>

  <header class="border-b border-[var(--border-color)] bg-[var(--bg-card)] sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      <a href="index.html" class="flex items-center gap-2 font-extrabold text-xl tracking-tight">
        <span class="w-9 h-9 rounded-xl bg-emerald-500 text-white flex items-center justify-center">🥗</span>
        <span>Change <span class="text-emerald-500">Fit</span></span>
      </a>

      <nav class="flex items-center gap-1 text-sm">
        <a href="index.html" class="nav-link" data-i18n="nav_plan">Мой План</a>
        <a href="dashboard.html" class="nav-link" data-i18n="nav_dash">Дашборд</a>
        <a href="scanner.html" class="nav-link" data-i18n="nav_scan">AI Сканер Еды</a>
        <a href="search.html" class="nav-link" data-i18n="nav_search">База Продуктов</a>
      </nav>

      <div class="flex items-center gap-2">
        <div id="langMenu" class="lang-menu"></div>
        <a id="accountChip" href="register.html" class="account-chip"></a>
        <button onclick="toggleTheme(event)" class="p-2 rounded-xl border border-[var(--border-color)]" aria-label="Theme"><span class="theme-ico"><span data-icon="sun"></span><span data-icon="moon"></span></span></button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 py-12 flex-1 w-full">
    <div class="card p-6 md:p-8 pop">
      <div class="flex p-1 rounded-xl bg-[var(--bg-main)] mb-6">
        <button type="button" id="tabReg" onclick="setTab('reg')" class="tab-btn active" data-i18n="tab_reg">Регистрация</button>
        <button type="button" id="tabLogin" onclick="setTab('login')" class="tab-btn" data-i18n="tab_login">Вход</button>
      </div>

      <h1 id="authTitle" class="text-2xl font-extrabold mb-1" data-i18n="reg_title">Создайте аккаунт</h1>
      <p id="authSub" class="text-sm text-[var(--text-muted)] mb-6" data-i18n="reg_sub">После регистрации вы попадёте в свой профиль</p>

      <form id="authForm" onsubmit="submitAuth(event)" class="space-y-4 mt-6" novalidate>
        <div id="nameRow">
          <label class="flex items-center gap-2 text-sm font-semibold mb-1.5"><span data-icon="user"></span><span data-i18n="lbl_name">Имя</span></label>
          <input type="text" id="inpName" maxlength="40" autocomplete="name" class="input-field">
        </div>
        <div>
          <label class="flex items-center gap-2 text-sm font-semibold mb-1.5"><span data-icon="mail"></span><span data-i18n="lbl_email">Эл. почта</span></label>
          <input type="email" id="inpEmail" autocomplete="email" class="input-field">
        </div>
        <div>
          <label class="flex items-center gap-2 text-sm font-semibold mb-1.5"><span data-icon="lock"></span><span data-i18n="lbl_pass">Пароль</span></label>
          <input type="password" id="inpPass" autocomplete="current-password" class="input-field">
        </div>
        <div id="genderRow">
          <label class="block text-sm font-semibold mb-1.5" data-i18n="lbl_gender">Пол</label>
          <select id="inpGender" class="input-field font-semibold">
            <option value="male" data-i18n="gender_m">Мужской</option>
            <option value="female" data-i18n="gender_f">Женский</option>
          </select>
        </div>
        <p id="authErr" class="hidden text-sm text-red-500 font-semibold"></p>
        <button type="submit" id="authBtn" class="btn-primary w-full text-center" data-i18n="btn_register">Создать аккаунт</button>
      </form>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    let mode = 'reg';
    if (getState().user) window.location.replace('profile.html');

    function setTab(m) {
      mode = m;
      const reg = m === 'reg';
      document.getElementById('tabReg').classList.toggle('active', reg);
      document.getElementById('tabLogin').classList.toggle('active', !reg);
      document.getElementById('nameRow').classList.toggle('hidden', !reg);
      document.getElementById('genderRow').classList.toggle('hidden', !reg);
      document.getElementById('authSub').classList.toggle('hidden', !reg);
      document.getElementById('authTitle').setAttribute('data-i18n', reg ? 'reg_title' : 'login_title');
      document.getElementById('authBtn').setAttribute('data-i18n', reg ? 'btn_register' : 'btn_login');
      document.getElementById('inpPass').autocomplete = reg ? 'new-password' : 'current-password';
      document.getElementById('authErr').classList.add('hidden');
      applyThemeAndLang();
    }

    function showErr(key) {
      const el = document.getElementById('authErr');
      el.textContent = t(key);
      el.classList.remove('hidden');
      el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    }

    async function submitAuth(e) {
      e.preventDefault();
      document.getElementById('authErr').classList.add('hidden');
      const name = document.getElementById('inpName').value.trim();
      const email = document.getElementById('inpEmail').value.trim().toLowerCase();
      const pass = document.getElementById('inpPass').value;
      const gender = document.getElementById('inpGender').value;
      let r;
      if (mode === 'reg') {
        if (!name || !email || !pass) return showErr('err_fill');
        if (pass.length < 6) return showErr('err_short');
        r = await registerUser({ name, email, pass, gender });
      } else {
        if (!email || !pass) return showErr('err_fill');
        r = await loginUser(email, pass);
      }
      if (!r.ok) return showErr(r.err);
      showDone(() => { window.location.href = 'profile.html'; });
    }
  </script>
</body>
</html>
