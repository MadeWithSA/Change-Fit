<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Fit — Профиль</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col">
  <div id="preloader" aria-hidden="true">
    <div class="pl-wrap">
      <svg class="pl-ring" viewBox="0 0 120 120"><circle class="pl-track" cx="60" cy="60" r="52"/><circle class="pl-fill" cx="60" cy="60" r="52"/></svg>
      <div class="pl-num"><span id="plNum">0</span><small data-i18n="kcal_unit">ккал</small></div>
    </div>
    <div class="pl-brand">Change <b>Fit</b></div>
  </div>
  <script>if (sessionStorage.getItem('nt_pl')) { var p = document.getElementById('preloader'); if (p) p.remove(); }</script>

  <header class="border-b border-[var(--border-color)] bg-[var(--bg-card)] sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      <a href="index.html" class="flex items-center gap-2 font-extrabold text-xl tracking-tight">
        <span class="w-9 h-9 rounded-xl bg-emerald-500 text-white flex items-center justify-center">🥗</span>
        <span>Change <span class="text-emerald-500">Fit</span></span>
      </a>

      <nav class="flex items-center gap-1 text-sm">
        <a href="index.html" class="nav-link" data-i18n="nav_plan">Мой План</a>
        <a href="dashboard.html" class="nav-link" data-i18n="nav_dash">Дашборд</a>
        <a href="scanner.html" class="nav-link" data-i18n="nav_scan">AI Сканер Еды</a>
        <a href="search.html" class="nav-link" data-i18n="nav_search">База Продуктов</a>
      </nav>

      <div class="flex items-center gap-2">
        <div id="langMenu" class="lang-menu"></div>
        <a id="accountChip" href="register.html" class="account-chip"></a>
        <button onclick="toggleTheme(event)" class="p-2 rounded-xl border border-[var(--border-color)]" aria-label="Theme"><span class="theme-ico"><span data-icon="sun"></span><span data-icon="moon"></span></span></button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full space-y-6">
    <div class="card p-6 md:p-8 flex flex-wrap items-center gap-6 pop">
      <div class="relative">
        <div id="profAvatar" class="avatar !w-24 !h-24 text-4xl"></div>
        <label class="absolute -bottom-1 -right-1 w-9 h-9 rounded-full bg-emerald-500 text-white flex items-center justify-center cursor-pointer hover:scale-110" style="transition: transform .15s" data-i18n-title="prof_photo">
          <span data-icon="camera"></span>
          <input type="file" id="avatarInput" accept="image/*" class="hidden" onchange="uploadAvatar(event)">
        </label>
      </div>
      <div class="flex-1 min-w-[200px]">
        <h1 id="profName" class="text-2xl md:text-3xl font-extrabold"></h1>
        <p id="profEmail" class="text-sm text-[var(--text-muted)]"></p>
        <p class="text-xs text-[var(--text-muted)] mt-1"><span data-i18n="prof_since">Аккаунт создан</span>: <span id="profSince"></span></p>
      </div>
      <button onclick="logout()" class="px-4 py-2 rounded-xl border border-[var(--border-color)] text-sm font-semibold flex items-center gap-2 hover:border-red-500 hover:text-red-500">
        <span data-icon="logout"></span><span data-i18n="btn_logout">Выйти</span>
      </button>
    </div>

    <div class="grid md:grid-cols-2 gap-6">
      <div class="card p-6">
        <h2 class="text-lg font-bold mb-4" data-i18n="prof_plan">Мой план</h2>
        <div class="grid grid-cols-2 gap-3 text-center">
          <div class="p-3 rounded-xl bg-[var(--bg-main)]"><span class="ico-badge" data-icon="flame" style="--c:#10b981"></span><div class="text-xs text-[var(--text-muted)]" data-i18n="lbl_target_kcal">Норма в день</div><div class="text-xl font-extrabold text-emerald-500"><span id="pKcal">0</span> <span class="text-xs" data-i18n="kcal_unit">ккал</span></div></div>
          <div class="p-3 rounded-xl bg-[var(--bg-main)]"><span class="ico-badge" data-icon="plan" style="--c:#8b5cf6"></span><div class="text-xs text-[var(--text-muted)]" data-i18n="lbl_goal">Цель</div><div class="text-xl font-extrabold" id="pGoal">-</div></div>
          <div class="p-3 rounded-xl bg-[var(--bg-main)]"><span class="ico-badge" data-icon="dumbbell" style="--c:#3b82f6"></span><div class="text-xs text-[var(--text-muted)]" data-i18n="protein">Белки</div><div class="text-xl font-extrabold text-blue-500"><span id="pP">0</span> <span class="text-xs" data-i18n="gram_unit">г</span></div></div>
          <div class="p-3 rounded-xl bg-[var(--bg-main)]"><span class="ico-badge" data-icon="drop" style="--c:#f59e0b"></span><div class="text-xs text-[var(--text-muted)]" data-i18n="fats">Жиры</div><div class="text-xl font-extrabold text-amber-500"><span id="pF">0</span> <span class="text-xs" data-i18n="gram_unit">г</span></div></div>
        </div>
        <a href="index.html" class="block text-center mt-4 py-2.5 rounded-xl border border-emerald-500 text-emerald-500 font-bold hover:bg-emerald-500 hover:text-white" data-i18n="edit_plan">Изменить план</a>
      </div>

      <div class="card p-6">
        <h2 class="text-lg font-bold mb-4" data-i18n="prof_today">Сегодня</h2>
        <div class="text-5xl font-extrabold text-emerald-500" id="tKcalWrap"><span id="tKcal">0</span> <span class="text-lg font-medium text-[var(--text-muted)]">/ <span id="tGoal">0</span> <span data-i18n="kcal_unit">ккал</span></span></div>
        <div class="progress-bar-bg mt-4"><div id="tBar" class="progress-bar-fill bg-emerald-500" style="width:0%"></div></div>
        <p class="text-sm text-[var(--text-muted)] mt-4"><span data-i18n="meals_count">Приёмов пищи</span>: <strong id="tMeals" class="text-[var(--text-main)]">0</strong></p>
        <a href="dashboard.html" class="block text-center mt-4 py-2.5 rounded-xl btn-primary" data-i18n="nav_dash">Дашборд</a>
      </div>
    </div>

    <form class="card p-6 grid sm:grid-cols-3 gap-4 items-end" onsubmit="saveProfile(event)">
      <div>
        <label class="block text-sm font-semibold mb-1.5" data-i18n="lbl_name">Имя</label>
        <input type="text" id="editName" maxlength="40" class="input-field">
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1.5" data-i18n="lbl_gender">Пол</label>
        <select id="editGender" class="input-field font-semibold">
          <option value="male" data-i18n="gender_m">Мужской</option>
          <option value="female" data-i18n="gender_f">Женский</option>
        </select>
      </div>
      <button type="submit" class="btn-primary" data-i18n="btn_save">Сохранить</button>
      <p id="savedMsg" class="hidden sm:col-span-3 text-sm font-bold text-emerald-500"></p>
    </form>
  </main>

  <script src="app.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const LOCALES = { ru: 'ru-RU', uz_lat: 'uz-UZ', uz_cyr: 'uz-Cyrl-UZ', en: 'en-US' };
    let filled = false;

    function renderPageSpecific() {
      const s = getState();
      const u = s.user;
      if (!u) { window.location.replace('register.html'); return; }

      setAvatar($('profAvatar'), u);
      $('profName').textContent = u.name;
      $('profEmail').textContent = u.email;
      $('profSince').textContent = new Date(u.createdAt || Date.now()).toLocaleDateString(LOCALES[s.lang] || 'ru-RU');
      if (!filled) { $('editName').value = u.name; $('editGender').value = u.gender || 'male'; filled = true; }

      const p = s.plan;
      animateNumber($('pKcal'), p.dailyKcal);
      animateNumber($('pP'), p.protein);
      animateNumber($('pF'), p.fats);
      $('pGoal').textContent = `-${p.lossKg} ${t('gram_unit') === 'g' ? 'kg' : 'кг'}`;

      const eaten = s.consumed.reduce((a, m) => a + m.kcal, 0);
      animateNumber($('tKcal'), Math.round(eaten));
      $('tGoal').textContent = p.dailyKcal;
      $('tMeals').textContent = s.consumed.length;
      const bar = $('tBar');
      bar.classList.toggle('over-bar', eaten > p.dailyKcal);
      setTimeout(() => { bar.style.width = Math.min(100, (eaten / p.dailyKcal) * 100) + '%'; }, 60);
    }

    function uploadAvatar(e) {
      const file = e.target.files[0];
      if (!file) return;
      const img = new Image();
      const reader = new FileReader();
      reader.onload = ev => { img.src = ev.target.result; };
      img.onload = () => {
        const size = 160, c = document.createElement('canvas');
        c.width = c.height = size;
        const m = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, size, size);
        persistUser({ avatar: c.toDataURL('image/jpeg', 0.8) });
        const av = $('profAvatar'); av.classList.remove('pop'); void av.offsetWidth; av.classList.add('pop');
        renderPageSpecific(); renderAccountChip();
      };
      reader.readAsDataURL(file);
    }

    function persistUser(patch) {
      const s = getState();
      s.user = { ...s.user, ...patch };
      if (patch.gender) s.plan = calcPlan({ ...s.plan, gender: patch.gender });
      saveState(s);
      const users = getUsers();
      if (users[s.user.email]) { Object.assign(users[s.user.email], patch); saveUsers(users); }
    }

    function saveProfile(e) {
      e.preventDefault();
      const name = $('editName').value.trim();
      if (!name) return;
      persistUser({ name, gender: $('editGender').value });
      renderPageSpecific(); renderAccountChip();
      const msg = $('savedMsg');
      msg.textContent = '✓ ' + t('saved_ok');
      msg.classList.remove('hidden', 'pop'); void msg.offsetWidth; msg.classList.add('pop');
    }
  </script>
</body>
</html>
